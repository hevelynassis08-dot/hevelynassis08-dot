<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Injector UI — Mock Seguro</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="card" role="main" aria-labelledby="title">
    <h1 id="title">Injector UI — Versão de Teste (Mock Seguro)</h1>

    <div class="notice" role="alert">
      <strong>Aviso:</strong> Esta página NÃO executa nem envia exploits nem jailbreaks. É apenas uma simulação para desenvolvimento/UX. Qualquer uso real de exploits sem autorização é ilegal.
    </div>

    <label for="target">Target (opcional, apenas para nota)</label>
    <input id="target" type="text" placeholder="https://example.com/endpoint (não será usado para ataques)" />

    <div class="controls">
      <button id="btnPayloads" class="primary">Inject Payloads (simular)</button>
      <button id="btnJailbreak" class="danger" title="Ação bloqueada por segurança">Inject Jailbreak (bloqueado)</button>
      <button id="btnAll" class="secondary">Inject All (simular)</button>
      <button id="btnCopy" class="secondary">Copiar payloads</button>
      <button id="btnDownload" class="secondary">Baixar payloads (.txt)</button>
    </div>

    <label for="log">Log / Payloads gerados</label>
    <textarea id="log" readonly placeholder="Aqui serão mostrados os payloads fictícios e logs..."></textarea>

    <div class="footer">
      <div class="muted">Mock de desenvolvimento — sem ações contra dispositivos.</div>
      <div>
        <button id="clear" class="secondary">Limpar</button>
      </div>
    </div>
  </main>

  <script src="app.js" defer></script>
</body>
</html>
